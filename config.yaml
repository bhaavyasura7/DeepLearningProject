server:
  host: "127.0.0.1"
  port: 8080

llm:
  model: "qwen3:8b"
  fallback_model: "gemma3:12b"  # bake-off challenger (make bakeoff)
  embedding_model: "nomic-embed-text"
  ollama_url: "http://127.0.0.1:11434"
  stub: false
  timeout_seconds: 60.0

retrieval:
  vector_top_k: 30
  graph_top_k: 30
  hybrid_cap: 50
  graph_damping: 0.85
  graph_hops: 2

ranking:
  final_k: 5
  eval_k: 10

data:
  catalog_path: "data/processed/catalog.jsonl"
  graph_path: "data/processed/graph.pkl"
  vector_dir: "data/processed/chroma"
  cache_path: "data/processed/profile_cache.json"
  scenarios_path: "demo/scenarios.json"
  traces_dir: "demo/traces"
  results_path: "demo/results/results.json"
  eval_checkpoint_path: "demo/results/eval_checkpoint.jsonl"

eval:
  seed: 42
  sample_viewers: 200
  cutoff_months: 12
  min_train_ratings: 20
  min_catalog_train_ratings: 50
  min_test_ratings_cold: 3
